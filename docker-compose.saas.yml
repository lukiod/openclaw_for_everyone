##
## OpenClaw SaaS — multi-tenant deployment
##
## Quick start:
##   cp .env.saas.example .env.saas
##   # edit .env.saas with your secrets
##   docker compose -f docker-compose.saas.yml --env-file .env.saas up -d
##
## The control-plane listens on port 3000 internally.
## nginx terminates TLS and proxies everything (HTTP + WS) to it.
## Each tenant's OpenClaw gateway runs on a loopback port (19000–29000)
## inside the control-plane container.
##

services:
  control-plane:
    build:
      context: .
      dockerfile: packages/control-plane/Dockerfile
    restart: unless-stopped
    environment:
      CONTROL_PLANE_PORT: "3000"
      CONTROL_PLANE_JWT_SECRET: ${CONTROL_PLANE_JWT_SECRET}
      CONTROL_PLANE_DATA_DIR: /data/control-plane
      OPENCLAW_TENANTS_DIR: /data/tenants
      OPENCLAW_BIN: node
      OPENCLAW_DIST_INDEX: /app/dist/index.js
      # Pass through any default model API keys (tenants inherit these unless
      # they set their own via the OpenClaw config UI)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - control-plane-data:/data/control-plane
      - tenant-data:/data/tenants
      ## Mount the built openclaw dist so the control-plane can spawn gateways
      - openclaw-dist:/app/dist:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./packages/control-plane/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${TLS_CERT_DIR:-./certs}:/etc/nginx/certs:ro
    networks:
      - internal
      - external
    depends_on:
      control-plane:
        condition: service_healthy

networks:
  internal:
    driver: bridge
  external:
    driver: bridge

volumes:
  control-plane-data:
  tenant-data:
  openclaw-dist:
